[project]
name = "projet-fil-rouge"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pandas>=1.3",
    "numpy>=1.20",
    "scikit-learn>=1.0",
    "joblib>=1.0",
    "matplotlib>=3.4",
    "seaborn>=0.11",
    "streamlit>=1.0",
    "supabase>=1.0",
    "python-dotenv>=0.21",
    "sqlalchemy>=1.4",
    "psycopg2-binary>=2.9",
]

[dependency-groups]
dev = [
    "ipykernel",
    "jupyter",
]
